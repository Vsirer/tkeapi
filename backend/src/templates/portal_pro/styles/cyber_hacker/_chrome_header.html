{# 赛博黑客顶栏：首页与子页共用，勿各自改一版 #}
<header class="cyber-site-header">
  <div class="container">
    <div class="header-inner">
      <a href="{{ nav.logo_link | default(value='/home-pro') | safe }}" class="brand-logo glow-text">
        {% if nav.logo_url %}
        <img src="{{ nav.logo_url | safe }}" alt="{{ nav.logo_text | default(value='Tkeapi') }}">
        {% else %}
        <span class="brand-mark" aria-hidden="true"></span>
        {% endif %}
        <span data-i18n-dynamic="{{ nav.logo_text | default(value='Tkeapi') }}">{{ nav.logo_text | default(value="Tkeapi") }}</span>
      </a>

      <nav class="cyber-site-nav">
        {% if nav.items %}
          {% for item in nav.items %}
            {% if item.enabled != false %}
            <a href="{{ item.path | default(value='#') | safe }}"{% if current_page is defined and item.key is defined and (current_page == item.key or (current_page == "models" and item.key == "marketplace") or (current_page == "marketplace" and item.key == "models")) %} class="on"{% endif %}{% if item.target_blank is defined and item.target_blank %} target="_blank" rel="noopener noreferrer"{% endif %}>// <span data-i18n-dynamic="{{ item.label }}">{{ item.label }}</span></a>
            {% endif %}
          {% endfor %}
        {% endif %}
      </nav>

      <div class="header-actions">
        <button class="icon-btn cyber-lang-btn active" id="lang-toggle" type="button" title="当前：中文，点击切换 English" aria-label="Switch language">
          <span id="lang-toggle-label">中</span>
        </button>

        <button class="icon-btn active" id="matrix-toggle" title="切换矩阵背景" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>

        <a href="https://github.com/aiqachat/tkeapi" target="_blank" rel="noopener noreferrer" class="icon-btn active" title="GitHub" aria-label="GitHub Repository">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </a>

        <a href="{{ nav.cta_link | default(value='/login') | safe }}" class="btn-cyber btn-lang-stable" data-i18n-dynamic="{{ nav.cta_text | default(value='登录|Login') }}"><span class="btn-lang-label">登录</span></a>
        <a href="{{ nav.register_link | default(value='/register') | safe }}" class="btn-cyber btn-cyber-solid btn-lang-stable" data-i18n-dynamic="{{ nav.register_text | default(value='注册|Sign Up') }}"><span class="btn-lang-label">注册</span></a>
      </div>
    </div>
  </div>
</header>
